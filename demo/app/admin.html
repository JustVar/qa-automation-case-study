<!doctype html><html><head><meta charset="utf-8"><title>Demo Video Portal - Users</title><link rel="stylesheet" href="style.css"></head>
<body><header><b>Demo Video Portal</b><a href="live.html">Live</a><a href="events.html">Events</a><a href="admin.html">Users</a></header>
<main><h2>Users</h2><div style="display:flex;gap:10px;max-width:520px"><input id="newuser" placeholder="new.user@example.com"><button id="add">Add user</button></div>
<table><tbody id="users"><tr><td>qa@example.com</td><td><button class="rm" style="width:auto">Remove</button></td></tr></tbody></table></main>
<script>
const tb = document.getElementById('users');
document.getElementById('add').onclick = () => { const v = document.getElementById('newuser').value; tb.insertAdjacentHTML('beforeend', `<tr><td>${v}</td><td><button class="rm" style="width:auto">Remove</button></td></tr>`); };
tb.onclick = e => { if (e.target.classList.contains('rm')) e.target.closest('tr').remove(); };
</script></body></html>
